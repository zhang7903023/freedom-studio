backend:
  name: git-gateway
  repo: zhang7903023/freedom-studio
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/a6ad6ddb-414f-408a-9bd9-595b60c2da11/pkce
  auth_token_endpoint: /sites/a6ad6ddb-414f-408a-9bd9-595b60c2da11/token
  gateway_url: https://gateway.decapbridge.com
  commit_messages:
    create: "Create {{collection}} '{{slug}}' - {{author-name}} via DecapBridge"
    update: "Update {{collection}} '{{slug}}' - {{author-name}} via DecapBridge"
    delete: "Delete {{collection}} '{{slug}}' - {{author-name}} via DecapBridge"
    uploadMedia: "Upload '{{path}}' - {{author-name}} via DecapBridge"
    deleteMedia: "Delete '{{path}}' - {{author-name}} via DecapBridge"

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

site_url: https://z8en.com
logo_url: https://decapbridge.com/decapcms-with-bridge.svg
locale: zh_Hans
display_url: z8en.com

# 文章里插入的图片存到 public/images/，网页上用 /images/xxx.png 引用
media_folder: public/images
public_folder: /images

collections:
  - name: settings
    label: 站点设置
    files:
      - name: site_settings
        label: 站点信息与页面内容
        file: src/data/site.json
        fields:
          - label: 站点信息
            name: site
            widget: object
            fields:
              - label: 站点全称（仅用于 SEO / 分享卡片）
                name: name
                widget: string
              - label: 顶栏 Logo 文字
                name: navName
                widget: string
                hint: 当前为 X，改这里顶栏就跟着变
              - label: 首页 Hero 大标题
                name: heroTitle
                widget: string
              - label: 副标题
                name: tagline
                widget: string
              - label: 站点简介
                name: description
                widget: text
              - label: 首页 SEO 标题
                name: title
                widget: string
              - label: 首页 SEO 描述
                name: homeDescription
                widget: text
          - label: 关于页
            name: about
            widget: object
            fields:
              - label: 介绍
                name: intro
                widget: text
              - label: 强调句
                name: emphasis
                widget: text
          - label: 联系方式（留空的项不显示在网站上）
            name: contact
            widget: object
            fields:
              - label: 邮箱
                name: email
                widget: string
                required: false
              - label: 微信
                name: wechat
                widget: string
                required: false
              - label: Telegram
                name: telegram
                widget: string
                required: false
              - label: WhatsApp
                name: whatsapp
                widget: string
                required: false
              - label: X（Twitter）
                name: x
                widget: string
                required: false
              - label: YouTube
                name: youtube
                widget: string
                required: false
          - label: 社交链接（页脚，留空则不显示）
            name: social
            widget: object
            fields:
              - label: X（Twitter）完整链接
                name: x
                widget: string
                required: false
              - label: YouTube 完整链接
                name: youtube
                widget: string
                required: false
              - label: Telegram 完整链接
                name: telegram
                widget: string
                required: false
          - label: 服务列表
            name: services
            widget: list
            fields:
              - label: 服务名称
                name: title
                widget: string
              - label: 服务描述
                name: description
                widget: text
              - label: 范围说明
                name: scope
                widget: text
                hint: 写清楚目前能提供到什么程度
  - name: blog
    label: 博客文章
    folder: src/content/blog
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    preview: false
    summary: "{{title}} - {{category}} · {{publishDate}}"
    fields:
      - label: 标题
        name: title
        widget: string
      - label: 一句话摘要
        name: description
        widget: string
      - label: 发布日期
        name: publishDate
        widget: datetime
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
      - label: 分类
        name: category
        widget: string
        default: 随笔
        hint: 建议：AI 工具 / 建站 / 折腾记录 / 创业笔记
      - label: 标签
        name: tags
        widget: list
        required: false
        default: []
      - label: 封面图（可选）
        name: cover
        widget: string
        required: false
        hint: 填文件名，如 cover-xxx.png（图片需放在 src/assets/covers/）。留空则无封面
      - label: 首页精选
        name: featured
        widget: boolean
        default: false
        required: false
      - label: 草稿
        name: draft
        widget: boolean
        default: false
        required: false
        hint: 开 true 则不显示在网站上
      - label: 正文
        name: body
        widget: markdown
